allowBuilds:
  # Restores symlinks for the bundled Postgres binaries (local dev/test DB only).
  "@embedded-postgres/windows-x64": true
  # Verifies esbuild's platform binary (used by Payload's tooling).
  esbuild: true
  sharp: false
  unrs-resolver: false

# Security patches for Payload's transitive dependencies (pnpm audit, 2026-10-16).
# Remove once Payload ships them itself.
overrides:
  undici@>=7.0.0 <7.29.1: 7.30.0
  dompurify@<3.4.16: 3.4.16
